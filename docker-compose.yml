services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edoc-backend
    restart: unless-stopped
    environment:
      API_PORT: "8080"
      P2P_ADDR: "0.0.0.0:8001"
      UPLOAD_DIR: "/app/uploads"
      DATABASE_URL: "${DATABASE_URL:-postgres://p2p_user:p2p_password_change_me@host.docker.internal:5432/stepa_db?sslmode=disable}"
    ports:
      - "${API_HOST_PORT:-18080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - edoc_uploads:/app/uploads

volumes:
  edoc_uploads:
